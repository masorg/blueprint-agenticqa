[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticqa"
version = "0.1.0"
description = "Agentic QA — a testing-pyramid QA app that runs as a Cloudera CML/CAI Analytical Application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "anthropic>=0.39",
    "openai>=1.30",
    "PyGithub>=2.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
data = ["pyarrow>=15", "huggingface_hub>=0.24"]
dev = ["pytest>=8", "pytest-reportlog>=0.4", "hypothesis>=6.100", "pytest-asyncio>=0.23"]

[project.scripts]
agenticqa = "agenticqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
